name: Perfil

on:
  schedule:
    - cron: "23 */6 * * *"   # cada 6 horas
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Serpiente de contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_TOKEN }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#7B2FF7&color_dots=#EBE6FA,#D6C8FA,#B9A1F7,#9468F2,#008EA6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#B47BFF&color_dots=#1E1940,#3A2F7A,#5B47B8,#8A6CF0,#3DE8EC

      - name: Tarjeta de estadísticas
        run: node scripts/stats.mjs
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT: dist

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: actualizar perfil"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
